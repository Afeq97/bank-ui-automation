[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: quick critical-path checks (login, balance, logout, auth redirect)
    regression: full regression suite
    transfer: fund transfer tests (move money between dummy UAT accounts)
    negative: negative / validation tests
    security: access-control and session security tests
    session: slow test that waits for the inactivity timeout
    unit: offline unit tests for helpers (no browser)
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %H:%M:%S
